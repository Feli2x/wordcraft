# Builds an installable WordCraft APK (arm64) for Android phones and tablets.
# Runs when the Android files change (on any branch) or from the Actions tab (Run workflow); the
# APK is attached to the run as the artifact "wordcraft-android-apk". A second job builds the app
# for an x86_64 emulator, plays a scripted test on it (android/test/phone-test.sh) and publishes
# the screenshots on the branch android-test-results (and as the artifact "emulator-test").
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/wordcraft-android/**"
      - "android/**"
      - "crates/fonts/src/fontdb/names.rs"
      - ".github/workflows/android.yml"

permissions:
  contents: read

# A newer push cancels a build still running for an older one.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CRAFT_I18N_DIR: ${{ github.workspace }}/../craft-i18n
      CRAFT_FONTS_DIR: ${{ github.workspace }}/../craft-fonts
      # Same craft-fonts commit as release.yml.
      CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
      # 16 KB pages (Android 15 devices): align the library's segments for them.
      CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
    steps:
      - uses: actions/checkout@v4

      # WordCraft changes daily and its newest code may not build for Android yet, so the APK is
      # built from a tested WordCraft commit with this branch's Android files laid over it. To move
      # on, raise WORDCRAFT_BASE and regenerate android/base.patch (Cargo.lock and fonts) for it.
      - name: Check out the tested WordCraft base
        env:
          WORDCRAFT_BASE: 09faec42ecf6eabe1fe3765fb10a0ac5d51be863
        run: |
          ov="$RUNNER_TEMP/overlay"
          mkdir -p "$ov"
          cp -r android apps/wordcraft-android "$ov/"
          git fetch -q --depth 1 origin "$WORDCRAFT_BASE"
          git checkout -q --force FETCH_HEAD
          git clean -qfdx
          rm -rf android apps/wordcraft-android
          cp -r "$ov/android" android
          cp -r "$ov/wordcraft-android" apps/wordcraft-android
          git apply android/base.patch
          git status --short

      # The interface translations (German menus) and the spelling and hyphenation data, at the
      # commit every official release uses; without them WordCraft is English-only.
      - name: Fetch craft-i18n and craft-fonts
        run: |
          fetch() { # repo dir sha
            git init -q "$2"
            git -C "$2" fetch -q --depth 1 "https://github.com/storytold/$1" "$3"
            git -C "$2" checkout -q FETCH_HEAD
          }
          fetch craft-i18n "$CRAFT_I18N_DIR" "$(cat craft-i18n.rev)"
          fetch craft-fonts "$CRAFT_FONTS_DIR" "$CRAFT_FONTS_REF"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libwordcraft_android.so
        run: |
          # The runner image sets these as machine variables (not in the `env` context).
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs \
            build -p wordcraft-android --release
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # One signing key for every build, so a new APK installs over the old one (Android refuses
      # an update signed with another key). It lives in this repository's Actions cache, which
      # only its workflows can read, never in the repository. The first run creates it; a cache
      # entry unused for 7 days is dropped, and the next APK then needs one reinstall.
      - name: Signing key (Actions cache)
        id: signing-key
        uses: actions/cache@v4
        with:
          path: android/wordcraft.keystore
          key: wordcraft-signing-key-v1

      - name: Create the signing key (first run only)
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -keystore android/wordcraft.keystore -storetype PKCS12 \
            -alias wordcraft -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass wordcraft-android -keypass wordcraft-android \
            -dname "CN=WordCraft Android (personal build)"

      - name: Package the APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  emulator-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      # Pushes the screenshots to the android-test-results branch (it holds no workflows).
      contents: write
    env:
      CRAFT_I18N_DIR: ${{ github.workspace }}/../craft-i18n
      CRAFT_FONTS_DIR: ${{ github.workspace }}/../craft-fonts
      CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
    steps:
      - uses: actions/checkout@v4

      - name: Check out the tested WordCraft base
        env:
          WORDCRAFT_BASE: 09faec42ecf6eabe1fe3765fb10a0ac5d51be863
        run: |
          ov="$RUNNER_TEMP/overlay"
          mkdir -p "$ov"
          cp -r android apps/wordcraft-android "$ov/"
          git fetch -q --depth 1 origin "$WORDCRAFT_BASE"
          git checkout -q --force FETCH_HEAD
          git clean -qfdx
          rm -rf android apps/wordcraft-android
          cp -r "$ov/android" android
          cp -r "$ov/wordcraft-android" apps/wordcraft-android
          git apply android/base.patch

      - name: Fetch craft-i18n and craft-fonts
        run: |
          fetch() { # repo dir sha
            git init -q "$2"
            git -C "$2" fetch -q --depth 1 "https://github.com/storytold/$1" "$3"
            git -C "$2" checkout -q FETCH_HEAD
          }
          fetch craft-i18n "$CRAFT_I18N_DIR" "$(cat craft-i18n.rev)"
          fetch craft-fonts "$CRAFT_FONTS_DIR" "$CRAFT_FONTS_REF"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-x86_64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libwordcraft_android.so (x86_64, for the emulator)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cargo ndk -t x86_64 -P 26 -o android/app/src/main/jniLibs build -p wordcraft-android --release

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Package the test APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -Pabis=x86_64

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the phone test on an emulator (Pixel 6, Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/test/phone-test.sh android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/test-results"

      - name: Publish the screenshots (branch android-test-results)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-results
          cd test-results
          printf 'Emulator test of %s (run %s)\n' "${{ github.sha }}" "${{ github.run_number }}" > README.txt
          git init -q
          git checkout -q -b android-test-results
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Emulator test, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:android-test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: test-results
